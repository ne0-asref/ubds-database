ubds_version: '1.2'
name: Adafruit Feather ESP32-S2
slug: adafruit-feather-esp32s2
manufacturer: Adafruit
board_type:
  - MCU
processing:
  - part_number: ESP32-S2
    architecture: Xtensa LX7
    cores: 1
    bit_width: 32
    clock: 240 MHz
    memory:
      ram_kb: 320
      flash_kb: 4096
interfaces:
  - name: UART
    type: UART
    count: 2
    availability: matrix-routable
  - name: SPI
    type: SPI
    count: 4
    availability: matrix-routable
    notes: SPI0/SPI1 internal; SPI2/SPI3 free.
  - name: I2C
    type: I2C
    count: 2
    availability: matrix-routable
  - name: I2S
    type: I2S
    count: 1
    availability: matrix-routable
  - name: LEDC
    type: PWM
    count: 8
    availability: matrix-routable
  - name: MCPWM
    type: PWM
    count: 1
    availability: matrix-routable
  - name: TWAI (CAN)
    type: TWAI
    count: 1
    availability: matrix-routable
  - name: SDMMC Host
    type: SDMMC
    count: 1
    availability: matrix-routable
  - name: ADC
    type: ADC
    count: 2
    availability: chip-specific
    notes: 20 channels total, 13-bit.
  - name: DAC
    type: DAC
    count: 2
    availability: chip-specific
    notes: 8-bit, fixed pins GPIO17/18.
  - name: Touch sensor
    type: Touch
    count: 14
    availability: chip-specific
  - name: USB OTG
    type: USB OTG
    count: 1
    availability: chip-specific
    notes: Full-speed USB 1.1 OTG, fixed pins GPIO19/20.
wireless:
  - protocol: WiFi
