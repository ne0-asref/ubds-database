name: ESP32-C6-DevKitM-1
slug: esp32-c6-devkitm-1
manufacturer: Espressif
board_type:
  - MCU
processing:
  - part_number: ESP32-C6FH4
    architecture: RISC-V
    clock: 160 MHz
    cores: 1
    bit_width: 32
interfaces:
  - name: USB
    type: USB
    count: 1
  - name: UART (via USB-to-UART bridge)
    type: UART
    count: 1
  - name: UART0
    type: UART
    count: 1
  - name: LP_UART
    type: UART
    count: 1
  - name: FSPI
    type: SPI
    count: 1
  - name: LP_I2C
    type: I2C
    count: 1
  - name: JTAG
    type: JTAG
    count: 1
wireless:
  - protocol: WiFi
    version: 802.11ax
  - protocol: BLE
    version: '5'
  - protocol: Zigbee
    version: '3.0'
  - protocol: Thread
    version: '1.3'
inputs:
  - name: Boot Button
    type: button
    description: Download button. Holding down Boot and then pressing Reset 
      initiates Firmware Download mode for downloading firmware through the 
      serial port.
  - name: Reset Button
    type: button
    description: Press this button to restart the system.
onboard_components:
  flash:
    role: SPI flash storage
    key spec: 4 MB
  usb_uart_bridge:
    role: USB-to-UART bridge
    key spec: up to 3 Mbps
  ldo:
    role: 5V to 3.3V LDO regulator
    key spec: 5V input, 3.3V output
  clock_gen:
    role: 40 MHz crystal oscillator
    key spec: 40 MHz
power:
  usb: USB Type-C to UART Port and ESP32-C6 USB Type-C Port (either one or both)
thermal: {}
physical: {}
boot: {}
software: {}
