    - https://github.com/espressif/esp-dev-kits/blob/master/examples/esp32-p4-eye/README.md
    - https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32p4/esp32-p4x-eye/user_guide.html
    - https://www.andibond.com/esp32-p4x-eye-pinout-technical-guide/
  product_url: 
